<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>旷野像素修仙</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#5fb8ff;touch-action:none;user-select:none;-webkit-user-select:none;font-family:monospace;}
#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair;}
.skill-btn{
  position:fixed;width:54px;height:54px;border-radius:50%;
  background:rgba(18,18,32,0.78);
  border:2px solid rgba(255,255,255,0.55);
  color:#fff;font-size:17px;font-weight:bold;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:10;font-family:monospace;
  overflow:hidden;transition:border-color .15s, box-shadow .15s, opacity .15s;
}
.skill-btn:active{transform:scale(0.94);}
.skill-btn .lbl{position:relative;z-index:2;}
.skill-btn .cd{position:absolute;z-index:3;font-size:20px;color:#fff;text-shadow:1px 1px 2px #000;}
.skill-btn.cooling .lbl{opacity:0;}
.skill-btn.cooling::after{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:rgba(0,0,0,0.58);z-index:1;
}
.skill-btn.skill{width:46px;height:46px;font-size:14px;border-color:rgba(125,249,255,0.7);}
.skill-btn.ultimate{width:70px;height:70px;font-size:19px;border-color:rgba(255,180,100,0.7);}
.skill-btn.ultimate.ult-idle{ border-color:rgba(255,180,100,0.7); opacity:1; }
.skill-btn.ultimate.ult-running{
  border-color:rgba(255,215,0,1);
  background:rgba(70,50,10,0.88);
  animation:ultPulse 0.9s ease-in-out infinite alternate;
}
.skill-btn.ultimate.ult-paused{ opacity:0.55; border-color:rgba(200,170,255,0.45); }
.skill-btn.ultimate.ult-debt{ opacity:0.32; filter:grayscale(0.75); pointer-events:none; }
@keyframes ultPulse{
  from{box-shadow:0 0 9px rgba(255,215,0,0.5), inset 0 0 8px rgba(255,215,0,0.22);}
  to{box-shadow:0 0 20px rgba(255,215,0,0.95), inset 0 0 16px rgba(255,215,0,0.5);}
}
#btnSkill{right:114px;bottom:28px;}
#btnUltimate{right:26px;bottom:26px;}
.key-tag{
  position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);
  font-size:10px;color:#cfd8dc;background:rgba(0,0,0,0.5);
  padding:1px 5px;border-radius:3px;white-space:nowrap;
}
#helpToggle{
  position:fixed;right:14px;bottom:104px;z-index:11;
  background:rgba(0,0,0,0.5);color:#ffe9a8;
  font-size:12px;padding:5px 10px;border-radius:4px;
  border:1px solid rgba(255,215,0,0.4);cursor:pointer;
}
#helpPanel{
  position:fixed;right:14px;bottom:140px;z-index:12;
  background:rgba(10,12,24,0.92);border:2px solid rgba(255,215,0,0.5);
  border-radius:8px;padding:14px 18px;color:#e8e8e8;font-size:13px;
  line-height:1.9;min-width:280px;box-shadow:0 4px 20px rgba(0,0,0,0.5);
}
#helpPanel.hidden{display:none;}
#helpPanel .title{color:#ffd700;font-size:15px;font-weight:bold;margin-bottom:6px;border-bottom:1px solid rgba(255,215,0,0.3);padding-bottom:4px;}
#helpPanel .row b{color:#7df9ff;display:inline-block;min-width:78px;}
#helpPanel .close-hint{color:#9aa0a6;font-size:11px;margin-top:6px;text-align:right;}
#charPanel{
  position:fixed;inset:0;z-index:20;display:none;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,0.65);
}
#charPanel.show{display:flex;}
.char-window{
  background:rgba(10,12,24,0.97);
  border:3px solid #d4af37;border-radius:10px;
  padding:20px 24px;color:#e8e8e8;font-size:13px;
  width:min(520px,92vw);max-height:88vh;overflow-y:auto;
  box-shadow:0 0 30px rgba(212,175,55,0.3);
}
.char-window .char-title{
  color:#ffd700;font-size:18px;font-weight:bold;text-align:center;
  border-bottom:1px solid rgba(255,215,0,0.3);padding-bottom:8px;margin-bottom:14px;
  display:flex;justify-content:space-between;align-items:center;
}
.char-window .char-close{
  cursor:pointer;color:#ff8a8a;font-size:20px;background:none;border:none;padding:0 4px;
}
.char-top{display:flex;gap:16px;align-items:flex-start;margin-bottom:14px;}
.char-portrait{
  width:84px;height:84px;flex-shrink:0;
  background:#15151f;border:2px solid #d4af37;border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-size:52px;
}
.char-info{flex:1;min-width:0;}
.char-info .cname{color:#ffd700;font-size:17px;font-weight:bold;}
.char-info .ctitle{color:#b86bff;font-size:12px;margin-bottom:6px;}
.char-info .crow{color:#cfd8dc;font-size:12px;line-height:1.9;}
.char-info .crow b{color:#7df9ff;display:inline-block;min-width:52px;}
.char-weapon{display:none;}
.char-section{
  color:#ffd700;font-size:14px;font-weight:bold;margin:14px 0 8px;
  border-left:3px solid #d4af37;padding-left:8px;
}
.char-stat{
  display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px;
}
.char-stat .sname{width:42px;color:#cfd8dc;text-align:right;}
.char-stat .sbar{flex:1;height:14px;background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.2);position:relative;}
.char-stat .sfill{height:100%;transition:width .15s;}
.char-stat .snum{width:82px;text-align:right;color:#fff;font-size:11px;}
.char-skills{display:flex;gap:20px;flex-wrap:wrap;}
.skill-card{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:pointer;padding:8px;border-radius:6px;transition:background .15s;
}
.skill-card:hover{background:rgba(125,249,255,0.12);}
.skill-card img{width:56px;height:56px;image-rendering:pixelated;border:2px solid rgba(125,249,255,0.5);border-radius:6px;background:#0a1628;}
.skill-card.ult img{border-color:rgba(200,160,255,0.6);}
.skill-card .sk-name{color:#7df9ff;font-size:12px;font-weight:bold;}
.skill-card.ult .sk-name{color:#c9a0ff;}
.skill-card .sk-key{color:#9aa0a6;font-size:10px;}
.skill-card.weapon-card{cursor:default;}
.skill-card.weapon-card:hover{background:transparent;}
.skill-card .weapon-icon-box{
  width:56px;height:56px;border:2px solid rgba(255,200,100,0.5);border-radius:6px;background:#1a1208;
  display:flex;align-items:center;justify-content:center;font-size:38px;
}
.skill-card.weapon-card .sk-name{color:#ffc864;}
#skillDetail{
  position:fixed;inset:0;z-index:30;display:none;
  align-items:center;justify-content:center;background:rgba(0,0,0,0.7);
}
#skillDetail.show{display:flex;}
.skill-detail-box{
  background:rgba(10,12,24,0.98);border:2px solid #7df9ff;border-radius:10px;
  padding:20px;width:min(400px,88vw);color:#e8e8e8;font-size:13px;line-height:1.9;
}
.skill-detail-box.ult{border-color:#c9a0ff;}
.skill-detail-box .d-title{color:#ffd700;font-size:16px;font-weight:bold;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.skill-detail-box .d-close-x{cursor:pointer;color:#ff8a8a;font-size:18px;background:none;border:none;}
.skill-detail-box .d-row b{color:#7df9ff;min-width:56px;display:inline-block;}
.skill-detail-box.ult .d-row b{color:#c9a0ff;}
.skill-detail-box .d-desc{margin-top:8px;color:#d0d0d0;}
.skill-detail-box .d-close{
  margin-top:14px;text-align:center;cursor:pointer;color:#ffd700;
  border:1px solid rgba(255,215,0,0.4);border-radius:4px;padding:5px 0;font-size:12px;
}
.skill-detail-box .d-close:hover{background:rgba(255,215,0,0.1);}
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="btnSkill" class="skill-btn skill"><span class="lbl">法术</span><span class="cd"></span><span class="key-tag">E</span></button>
<button id="btnUltimate" class="skill-btn ultimate"><span class="lbl">神通</span><span class="cd"></span><span class="key-tag">Q</span></button>
<div id="helpToggle">按 U 查看操作</div>
<div id="helpPanel" class="hidden">
  <div class="title">操作说明</div>
  <div class="row"><b>A / D</b>左右移动</div>
  <div class="row"><b>Space</b>跳跃（空中再按 = 二段跳，消耗罡气）</div>
  <div class="row"><b>Ctrl</b>疾跑（消耗体力，高速移动）</div>
  <div class="row"><b>Shift</b>罡冲/闪避（消耗罡气，空中限1次）</div>
  <div class="row"><b>鼠标左键</b>普攻（0.7秒冷却）</div>
  <div class="row"><b>E</b>法术（消耗灵力，3秒冷却）</div>
  <div class="row"><b>Q</b>神通｜短按开启/暂停神通域；神通域开启时长按释放终结爆发</div>
  <div class="row"><b>点击头像</b>打开人物界面</div>
  <div class="row"><b>U</b>开关本面板</div>
  <div class="close-hint">按 U 关闭</div>
</div>
<div id="charPanel">
  <div class="char-window">
    <div class="char-title">人物信息<button class="char-close" id="charClose">&#10005;</button></div>
    <div class="char-top">
      <div class="char-portrait">&#129312;</div>
      <div class="char-info">
        <div class="cname" id="ciName"></div>
        <div class="ctitle" id="ciTitle"></div>
        <div class="crow" id="ciBio"></div>
      </div>
    </div>
    <div class="char-section">属性</div>
    <div id="charStats"></div>
    <div class="char-section">武器</div>
    <div class="char-skills">
      <div class="skill-card weapon-card" id="cardWeapon">
        <div class="weapon-icon-box">&#129308;</div>
        <div class="sk-name" id="ciWeapon"></div>
        <div class="sk-key">鼠标左键 普攻</div>
      </div>
    </div>
    <div class="char-section">功法</div>
    <div class="char-skills">
      <div class="skill-card" id="cardSpell">
        <img id="iconSpell" alt="青风诀">
        <div class="sk-name" id="spellName"></div>
        <div class="sk-key" id="spellKey"></div>
      </div>
      <div class="skill-card" id="cardJump">
        <img id="iconJump" alt="踏空跃">
        <div class="sk-name" id="jumpName"></div>
        <div class="sk-key" id="jumpKey"></div>
      </div>
      <div class="skill-card" id="cardDash">
        <img id="iconDash" alt="罡冲">
        <div class="sk-name" id="dashName"></div>
        <div class="sk-key" id="dashKey"></div>
      </div>
    </div>
    <div class="char-section">神通</div>
    <div class="char-skills">
      <div class="skill-card ult" id="cardUlt">
        <img id="iconUlt" alt="罡风领域">
        <div class="sk-name" id="ultName"></div>
        <div class="sk-key" id="ultKey"></div>
      </div>
    </div>
  </div>
</div>
<div id="skillDetail">
  <div class="skill-detail-box" id="detailBox">
    <div class="d-title"><span id="detailTitle"></span><button class="d-close-x" id="detailCloseX">&#10005;</button></div>
    <div class="d-row"><b>按键</b><span id="detailKey"></span></div>
    <div class="d-row"><b>消耗</b><span id="detailCost"></span></div>
    <div class="d-row"><b>冷却</b><span id="detailCd"></span></div>
    <div class="d-row"><b>来历</b><span id="detailOrigin"></span></div>
    <div class="d-desc" id="detailDesc"></div>
    <div class="d-close" id="detailClose">关 闭</div>
  </div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;
function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', ()=>{ resize(); if(player.onGround) player.y = gy()-player.h; });
resize();
const charInfo = {
  name: '流浪者',
  title: '初入修行的散修',
  weapon: '拳头',
  bio: '来历不明的独行修士，以拳掌御使风灵之气，行走于旷野之间。',
  spell: {
    name: '青风诀',
    key: 'E',
    desc: '凝聚风系灵气于拳面，释放环形风冲击退周围敌人，并使后续3次普通攻击附带风灵之力（附魔持续4秒）。',
    origin: '旷野平原散修间流传的低阶风系术法，以灵力引动气流缠于拳脚。',
    cost: '灵力 20',
    cd: '3秒',
  },
  jump: {
    name: '踏空跃',
    key: 'Space',
    desc: '空中再按跳跃，消耗罡气凌空二段跳。',
    origin: '修行者以罡气踏空再跃的基础身法，世间武者多有通晓。',
    cost: '罡气 15',
    cd: '无（空中限1次）',
  },
  dash: {
    name: '罡冲',
    key: 'Shift',
    desc: '短距离冲刺闪避，消耗罡气，附带短暂无敌帧。',
    origin: '散修在妖兽追猎中搏命悟出的短距瞬身术，以罡气爆发身形。',
    cost: '罡气 25',
    cd: '0.5秒',
  },
  ultimate: {
    name: '罡风领域',
    key: 'Q',
    desc: '展开风之领域，持续消耗灵力与心神；领域开启时长按释放龙卷风终结技，释放后神魂失神3秒。',
    origin: '传闻上古风系大能陨落前悟得的领域神通，可引动天地罡风环绕己身。',
    cost: '灵力 8/秒 + 心神 10/秒',
    cd: '无（受资源限制）',
  }
};
const MAP_W = 32000;      // 世界宽度
const MAP_H = H;
const GROUND_H = 150;
const gy = () => H - GROUND_H;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rng = mulberry32(20260818);
const decos = [];
for(let x=120; x<MAP_W-120;){
  const r=rng();
  if(r<0.24) decos.push({t:'tree',x,s:0.9+rng()*0.7});
  else if(r<0.40) decos.push({t:'rock',x,s:0.8+rng()*0.7});
  else if(r<0.66) decos.push({t:'flower',x,c:['#ff5d8f','#ffd23f','#5ec8ff','#c77dff','#ff8a5c'][Math.floor(rng()*5)]});
  else decos.push({t:'grass',x});
  x += 56 + rng()*110;
}
// 程序化生成村庄：30户民房 + 特殊建筑 + 篝火 + 装饰物 + 大型集市
// 全部经过碰撞检测，保证零重叠
const VILLAGE_X_START = 4500;  // 村子起点
const VILLAGE_X_END   = 30500;  // 村子终点
const VILLAGE_SQUARE_START = 14000; // 神树广场左边界（广场2400px宽）
const VILLAGE_SQUARE_END   = 16400; // 神树广场右边界
// 清除广场范围内的背景装饰树/石，避免挡住石灯笼和神树（灯笼周围80px内无树）
for(let i=decos.length-1; i>=0; i--){
  const d = decos[i];
  if(d.x > VILLAGE_SQUARE_START - 80 && d.x < VILLAGE_SQUARE_END + 80){
    if(d.t === 'tree' || d.t === 'rock') decos.splice(i, 1);
  }
}
  // 清除大型集市范围内的背景装饰树/石（集市里不能有树）
  const MARKET_X = 20100;
  const MARKET_W = 2200;
for(let i=decos.length-1; i>=0; i--){
  const d = decos[i];
  if(d.x > MARKET_X - MARKET_W/2 - 30 && d.x < MARKET_X + MARKET_W/2 + 30){
    if(d.t === 'tree' || d.t === 'rock') decos.splice(i, 1);
  }
}
// 清除晒谷场范围内的背景装饰树/石（晒谷场不能有树）
  const THRESHING_X = 24000;
  const THRESHING_W = 500;
for(let i=decos.length-1; i>=0; i--){
  const d = decos[i];
  if(d.x > THRESHING_X - THRESHING_W/2 - 20 && d.x < THRESHING_X + THRESHING_W/2 + 20){
    if(d.t === 'tree' || d.t === 'rock') decos.splice(i, 1);
  }
}
const HOUSE_GAP_MIN = 70;       // 相邻房子飞檐间最小间距(px)
const HOUSE_CX_MIN_DIST = 400;  // 房子中心最小间距

// 神树（超级大，放在广场中心）
decos.push({t:'tree', x:(VILLAGE_SQUARE_START+VILLAGE_SQUARE_END)/2, s:5.0, big:true, sacred:true});

// 房子配置模板（30户，8户小房子+22户大房子，大小交替分布）
// 小房子：2间房，总宽约250-300px，墙高150-160px
// 大房子：3-4间房，总宽约360-500px，墙高160-180px，带门廊
// 每栋都有烟囱，屋顶高60px，飞檐22px每侧
// 门44×80（大房子50×90），窗户32×32，窗户顶离地67px，比门顶低
const ROOF_OVER = 22;
const ROOF_H = 60;
// 墙色/屋顶色调色板（多色调，避免重复）
const _wallPalette = ['#8b7355','#9b8565','#7a6548','#a08868','#856a4a','#968060','#7b6850','#8f7858','#7c6a52','#9a8665'];
const _roofPalette = ['#5a4a3a','#6b5a42','#4a3a2a','#5c4a36','#635240','#56463a','#4c3c2e','#5e4d3c','#524438','#665545'];
const houseTemplates = [
  // 村西段 1-15（广场左侧，大小交替，确保每4户有1户小房子）
  // 1. 大房子（3间，带门廊）
  {wallColor:'#8b7355', roofColor:'#5a4a3a', hWall:170, porch:true, chimney:true, chimneyX:0.30, cracked:false, patched:false, broken:false,
   rooms:[{w:115,door:true,doorPos:0.45,winTypeL:'cross',winTypeR:'vert'},{w:105,door:false,winTypeL:'horiz',winTypeR:'diag'},{w:100,door:true,doorPos:0.5,winTypeL:'solid',winTypeR:'cross'}]},
  // 2. 小房子（2间）
  {wallColor:'#9b8565', roofColor:'#6b5a42', hWall:155, porch:false, chimney:true, chimneyX:0.65, cracked:true, patched:false, broken:false,
   rooms:[{w:110,door:true,doorPos:0.5,winTypeL:'diag',winTypeR:'cross'},{w:100,door:true,doorPos:0.55,winTypeL:'vert',winTypeR:'solid'}]},
  // 3. 大房子（4间，超宽，带门廊）
  {wallColor:'#7a6548', roofColor:'#5a4a3a', hWall:175, porch:true, chimney:true, chimneyX:0.42, cracked:false, patched:false, broken:false,
   rooms:[{w:105,door:true,doorPos:0.4,winTypeL:'cross',winTypeR:'horiz'},{w:95,door:false,winTypeL:'vert',winTypeR:'diag'},{w:95,door:true,doorPos:0.5,winTypeL:'solid',winTypeR:'cross'},{w:90,door:false,winTypeL:'diag',winTypeR:'vert'}]},
  // 4. 大房子（3间，带门廊）
  {wallColor:'#a08868', roofColor:'#4a3a2a', hWall:168, porch:true, chimney:true, chimneyX:0.58, cracked:false, patched:false, broken:false,
   rooms:[{w:110,door:true,doorPos:0.4,winTypeL:'vert',winTypeR:'cross'},{w:100,door:false,winTypeL:'horiz',winTypeR:'diag'},{w:92,door:true,doorPos:0.5,winTypeL:'cross',winTypeR:'solid'}]},
  // 5. 大房子（3间，带门廊）
  {wallColor:'#856a4a', roofColor:'#5c4a36', hWall:172, porch:true, chimney:true, chimneyX:0.38, cracked:true, patched:true, broken:false,
   rooms:[{w:112,door:true,doorPos:0.45,winTypeL:'cross',winTypeR:'vert'},{w:102,door:false,winTypeL:'horiz',winTypeR:'solid'},{w:95,door:true,doorPos:0.5,winTypeL:'diag',winTypeR:'cross'}]},

// 计算房子总宽（含飞檐ROOF_OVER每侧）
function houseTotalW(h){ return h.rooms.reduce((a,r)=>a+(r.w||0),0) + ROOF_OVER*2; }
function houseLeft(h){ return h.x - houseTotalW(h)/2; }
function houseRight(h){ return h.x + houseTotalW(h)/2; }

// ========== 村庄生成 ==========
// 生成顺序：先放特殊建筑（穿插在村庄内）→ 再放民房（绕开建筑+广场）→ 最后篝火+装饰物

// 生成特殊建筑：穿插在村庄内，返回 {buildings, occupied}
function generateBuildings(){
  const result = [];
  const occupied = []; // {l, r, t} 占用区间
  const sqCenter = (VILLAGE_SQUARE_START + VILLAGE_SQUARE_END) / 2;
  
  // 缓冲边距（建筑与建筑/建筑与民房间至少留的空隙）
  const BUF = 25;
  
  function addBuilding(def, cx){
    const b = {t: def.t, x: cx, w: def.w};
    if(def.h !== undefined) b.h = def.h;
    if(def.roofH !== undefined) b.roofH = def.roofH;
    if(def.flatW !== undefined) b.flatW = def.flatW;
    if(def.postH !== undefined) b.postH = def.postH;
    if(def.wallColor !== undefined) b.wallColor = def.wallColor;
    result.push(b);
    // 碰撞用总宽 = 绘制宽度 + 两侧飞檐/围栏
    const overMap = {
      shrine: 50, blacksmith: ROOF_OVER, granary: 28, tudi: 18,
      woodshed: 16, mill: 70, tavern: 35, teaShed: 30, market: 50,
      threshing: 20, pigpen: 20, school: 45, clinic: 25, stage: 20,
      carpenter: 25, tofuShop: 20,
      chickenCoop: 15, duckCoop: 15, gooseCoop: 15, horsePen: 25
    };
    const over = overMap[def.t] || 0;
    const totalW = def.w + over * 2;
    occupied.push({l: cx - totalW/2 - BUF/2, r: cx + totalW/2 + BUF/2, t: def.t});
  }
  
  // ===== 村内建筑（从西到东，穿插分布，东西两端都要有特殊建筑） =====
  // 1. 土地庙：村口 x=4350
  addBuilding({t:'tudi',      w:90,  h:110, roofH:40, flatW:32}, 4350);
  // 2. 粮仓1（村西）x≈5800
  addBuilding({t:'granary',   w:180, h:120, roofH:55, flatW:74}, 5800);
  // 3. 磨坊：村西 x≈6800
  addBuilding({t:'mill',      w:180, h:240, roofH:80, flatW:70}, 6800);
  // 4. 猪圈：村西 x≈7800（320宽，细化）
  addBuilding({t:'pigpen',    w:320}, 7800);
  // 5. 鸡圈：村西 x≈8600（小圈）
  addBuilding({t:'chickenCoop', w:200}, 8600);
  // 6. 茶棚：村中西 x≈9600（500宽，纯2D平面大草棚，6桌椅并排）
  addBuilding({t:'teaShed',   w:500, h:120, roofH:70, flatW:180}, 9600);
  // 7. 学堂：村中西 x≈11000
  addBuilding({t:'school',    w:400, h:220, roofH:90, flatW:160}, 11000);
  // 8. 医馆：村中西 x≈12200
  addBuilding({t:'clinic',    w:260, h:180, roofH:75, flatW:100}, 12200);
  // 9. 柴房1（村西）x≈13000
  addBuilding({t:'woodshed',  w:140, h:105, roofH:52, flatW:52}, 13000);

  // 10. 神树广场（仅占用区间，不在buildings数组）
  occupied.push({l: VILLAGE_SQUARE_START, r: VILLAGE_SQUARE_END, t: 'square'});

  // 11. 祠堂：广场东侧（紧贴东边界外侧），门前朝广场无遮挡 x≈16900
  addBuilding({t:'shrine',    w:400, h:190, roofH:85, flatW:120}, 16900);
  // 12. 戏台：村中东 x≈17700
  addBuilding({t:'stage',     w:320, h:60, roofH:90, flatW:180, platformH:60}, 17700);
  // 13. 铁匠铺：村中东 x≈18400
  addBuilding({t:'blacksmith',w:240, h:0, roofH:65, flatW:90, postH:150}, 18400);
  // 14. 酒坊：村中东 x≈19200
  addBuilding({t:'tavern',    w:300, h:180, roofH:70, flatW:110, wallColor:'#5a3a22'}, 19200);
  // 15. 鸭圈：村中东 x≈19800
  addBuilding({t:'duckCoop',  w:220}, 19800);
  // 16. 超大集市：x≈21200（2200px宽，24个摊位，东西牌坊）
  addBuilding({t:'market',    w:2200, h:0}, 21200);
  // 17. 鹅圈：村东 x≈22800
  addBuilding({t:'gooseCoop', w:240}, 22800);
  // 18. 木匠铺：村东 x≈23600
  addBuilding({t:'carpenter', w:240, h:130, roofH:65, flatW:100}, 23600);
  // 19. 晒谷场：村东 x≈24600
  addBuilding({t:'threshing', w:500}, 24600);
  // 20. 豆腐坊：村东 x≈25400
  addBuilding({t:'tofuShop',  w:220, h:140, roofH:65, flatW:90}, 25400);
  // 21. 粮仓2（村东）x≈26200
  addBuilding({t:'granary',   w:180, h:120, roofH:55, flatW:74}, 26200);
  // 22. 马圈（大马棚）：村东 x≈27200
  addBuilding({t:'horsePen',  w:380}, 27200);
  // 23. 柴房2（村东）x≈28100
  addBuilding({t:'woodshed',  w:140, h:105, roofH:52, flatW:52}, 28100);

  // 木杆红灯笼（2根）：广场左前、右前各一根，褐色高木杆+横杆+红椭圆灯笼
  result.push({t:'poleLantern', x: sqCenter - 350});
  result.push({t:'poleLantern', x: sqCenter + 350});
  // 石灯笼（4个）：前排2个靠近土路（广场前边缘），后排2个靠近神树
  // 左右对称，不被树挡
  result.push({t:'lantern', x: sqCenter - 200, frontRow: true});  // 左前
  result.push({t:'lantern', x: sqCenter + 200, frontRow: true});  // 右前
  result.push({t:'lantern', x: sqCenter - 350, frontRow: false}); // 左后
  result.push({t:'lantern', x: sqCenter + 350, frontRow: false}); // 右后
  // 祭坛在神树正前方
  result.push({t:'altar', x: sqCenter});

  occupied.sort((a,b) => a.l - b.l);
  return {buildings: result, occupied: occupied};
}

// 生成28户房子：沿x轴顺序放置，遇到特殊建筑/广场自动跳过，村东边界截断
function generateHouses(occupied){
  const result = [];
  const n = houseTemplates.length;
  
  let x = VILLAGE_X_START + 20 + houseTotalW(houseTemplates[0]) / 2;
  let placed = 0;
  let guard = 0;
  
  while(placed < n && guard < 2000){
    guard++;
    const tpl = houseTemplates[placed];
    if(!tpl) break;
    const hw = houseTotalW(tpl);
    
    // 检查与占用区间的重叠，如有则推到其右侧
    let blocked = false;
    let pushTo = 0;
    for(const o of occupied){
      if(x + hw/2 > o.l && x - hw/2 < o.r){
        pushTo = Math.max(pushTo, o.r + HOUSE_GAP_MIN + hw/2);
        blocked = true;
      }
    }
    if(blocked){
      x = pushTo;
      continue;
    }
    
    // 村东边界检查：右边缘必须在 MAP_W - 400 以内（最东端留400px空地）
    if(x + hw/2 > MAP_W - 400) break;
    
    // 放置
    result.push({...tpl, x: x, rooms: tpl.rooms.map(r=>({...r}))});
    placed++;
    
    // 下一户位置：先留 HOUSE_GAP_MIN 间隙
    if(placed < n){
      const nextTpl = houseTemplates[placed];
      const nextHw = houseTotalW(nextTpl);
      x = x + hw/2 + HOUSE_GAP_MIN + nextHw/2;
    }
  }
  
  // 间距检查：任意相邻两栋建筑（民房或特殊建筑）间距超过350px就补民房填补空地
  // 收集所有结构的左右边界，按x排序后检查空隙
  const allStructs = [];
  // occupied 里有大型建筑 + 广场(square)区间，足够用来判断大空隙
  for(const b of occupied) allStructs.push({l: b.l, r: b.r, t: b.t || 'building'});
  for(const h of result){
    const hw = houseTotalW(h);
    allStructs.push({l: h.x - hw/2, r: h.x + hw/2, t: 'house'});
  }
  allStructs.sort((a,b) => a.l - b.l);
  // 开放大场地类型，这些旁边的大空隙是正常的，不填补
  const openTypes = ['market', 'threshing', 'pigpen', 'stage', 'square', 'chickenCoop', 'duckCoop', 'gooseCoop', 'horsePen'];
  // 小房子模板（2间房，小而灵活，便于插入）
  const fillTemplate = houseTemplates.find(t => t.rooms.length === 2 && !t.porch) || houseTemplates[1];
  const fillW = houseTotalW(fillTemplate);
  const fillGap = 350; // 间距上限
  let fillGuard = 0;
  let changed = true;
  while(changed && fillGuard < 50){
    fillGuard++;
    changed = false;
    // 重新计算所有结构
    allStructs.length = 0;
    for(const b of occupied) allStructs.push({l: b.l, r: b.r, t: b.t || 'building'});
    for(const h of result){
      const hw = houseTotalW(h);
      allStructs.push({l: h.x - hw/2, r: h.x + hw/2, t: 'house'});
    }
    allStructs.sort((a,b) => a.l - b.l);
    // 找第一个 >350px 的空隙
    for(let i=0; i<allStructs.length-1; i++){
      const a = allStructs[i], b = allStructs[i+1];
      const gap = b.l - a.r;
      if(gap <= fillGap) continue;
      if(a.l < VILLAGE_X_START || b.r > VILLAGE_X_END) continue;
      if(openTypes.includes(a.t) || openTypes.includes(b.t)) continue;
      // 空隙里可以塞1-2户小房子
      const canFit = Math.floor((gap - HOUSE_GAP_MIN) / (fillW + HOUSE_GAP_MIN));
      if(canFit <= 0) continue;
      const fitCount = Math.min(canFit, 2);
      for(let k=0; k<fitCount; k++){
        const newX = a.r + HOUSE_GAP_MIN + fillW/2 + k*(fillW + HOUSE_GAP_MIN);
        if(newX + fillW/2 > b.l - HOUSE_GAP_MIN) break;
        // 深拷贝模板
        const newHouse = JSON.parse(JSON.stringify(fillTemplate));
        newHouse.x = newX;
        result.push(newHouse);
      }
      changed = true;
      break; // 每轮只处理第一个空隙，然后重新排序
    }
  }
  // 按 x 重新排序
  result.sort((a,b) => a.x - b.x);

  return result;
}

// 生成篝火位置（铁匠棚旁边露天位置）
function generateCampfire(houses, buildings, occupied){
  const bs = buildings.find(b=>b.t==='blacksmith');
  const ws = buildings.find(b=>b.t==='woodshed');
  if(!bs) return {x:7500, w:50, h:10, flameH:38, lit:true, smokeTimer:0, smoke:[], fireParticles:[]};
  
  // 铁匠棚真实右边缘（含飞檐，不加占用缓冲）
  const bsRightReal = bs.x + bs.w/2 + ROOF_OVER;
  const bsLeftReal = bs.x - bs.w/2 - ROOF_OVER;
  
  let campX = null;
  
  // 篝火放在铁匠铺右侧露天处（紧贴棚子），和集市/柴房无关
  const rightGap = 50; // 离铁匠棚右边缘 50px
  campX = bsRightReal + rightGap;
  
  // 如果右侧有建筑占用或重叠，就放左侧
  function overlapsAny(x, halfW){
    for(const h of houses){
      if(x + halfW > houseLeft(h) && x - halfW < houseRight(h)) return true;
    }
    for(const b of buildings){
      const bw = b.w || 40;
      if(b.t === 'lantern' || b.t === 'altar' || b.t === 'tudi' || b.t === 'poleLantern') continue; // 小装饰忽略
      if(x + halfW > b.x - bw/2 && x - halfW < b.x + bw/2) return true;
    }
    return false;
  }
  if(overlapsAny(campX, 25)){
    campX = bsLeftReal - 50; // 左侧
  }
  
  // 若重叠，微调位置
  if(overlapsAny(campX, 25)){
    // 往右微调
    let tryX = campX + 10;
    let tries = 0;
    while(overlapsAny(tryX, 25) && tries < 30){
      tryX += 10;
      tries++;
    }
    if(!overlapsAny(tryX, 25)) campX = tryX;
  }
  
  return {
    x: campX,
    w: 50, h: 10, flameH: 38,
    lit: true,   // 铁匠铺篝火永不熄灭
    smokeTimer: 0, smoke: [], fireParticles: [],
  };
}

// 生成装饰物（跟着建筑走，不飘在路上）
function generateDecos(houses, buildings, occupied){
  const decos = [];
  
  // === 井：4个，分散在村西、村中（广场两侧）、村东 ===
  // 村西段（广场西边）
  const westHouses = houses.filter(h => h.x < VILLAGE_SQUARE_START - 400);
  // 村东段（广场东边）
  const eastHouses = houses.filter(h => h.x > VILLAGE_SQUARE_END + 400);
  // 广场东侧一段（戏台/铁匠铺附近）
  const nearSqHouses = houses.filter(h => h.x > VILLAGE_SQUARE_END && h.x < VILLAGE_SQUARE_END + 2500);
  
  function placeWell(houseList){
    if(houseList.length < 1) return null;
    // 选中间那栋房子右侧（或两栋中间）
    if(houseList.length === 1){
      const h = houseList[0];
      let cx = houseRight(h) + 30;
      for(const o of occupied){
        if(cx + 25 > o.l && cx - 25 < o.r) cx = o.r + 30;
      }
      return cx;
    }
    const mid = Math.floor(houseList.length / 2) - 1;
    const hL = houseList[mid];
    const hR = houseList[mid + 1];
    let cx = (houseRight(hL) + houseLeft(hR)) / 2;
    for(const o of occupied){
      if(cx + 25 > o.l && cx - 25 < o.r) cx = o.r + 30;
    }
    return cx;
  }
  
  const wellWest = placeWell(westHouses);
  const wellEast = placeWell(eastHouses);
  // 村中东（广场东侧）也放一口
  const wellMid = placeWell(nearSqHouses);
  // 村中西（学堂/医馆之间）也放一口
  const westMidHouses = houses.filter(h => h.x > 10000 && h.x < VILLAGE_SQUARE_START);
  const wellMidW = placeWell(westMidHouses);
  
  if(wellWest) decos.push({t:'well', x: wellWest});
  if(wellMidW) decos.push({t:'well', x: wellMidW});
  if(wellMid) decos.push({t:'well', x: wellMid});
  if(wellEast) decos.push({t:'well', x: wellEast});
  
  // 干草堆：每隔几户在房子墙边放一个
  for(let i=0; i<houses.length; i++){
    if(i % 4 !== 1 && i % 4 !== 3) continue;
    const h = houses[i];
    const s = 1.0 + (i%3)*0.15;
    const hxR = h.x + h.rooms.reduce((a,r)=>a+(r.w||0),0)/2;
    decos.push({t:'hay', x: hxR - 28*s - 5, s: s});
  }
  
  // 栅栏：在村两头
  decos.push({t:'fence', x: VILLAGE_X_START - 80, count: 5, broken: 1});
  decos.push({t:'fence', x: VILLAGE_X_END + 80, count: 5, broken: 0});
  // 祠堂旁边
  const shrine = buildings.find(b=>b.t==='shrine');
  if(shrine){
    decos.push({t:'fence', x: shrine.x - 130, count: 3, broken: 1});
    decos.push({t:'fence', x: shrine.x + 130, count: 3, broken: 1});
  }
  
  // 晾衣架：选几户门口放
  for(let i=0; i<houses.length; i++){
    if(i % 5 !== 2) continue;
    const h = houses[i];
    decos.push({t:'rack', x: houseLeft(h) - 12, clothes: (i%2===0)});
  }
  
  // 树桩：村口和几户旁边
  decos.push({t:'stump', x: VILLAGE_X_START - 30});
  for(let i=2; i<houses.length; i+=5){
    const h = houses[i];
    decos.push({t:'stump', x: houseRight(h) - 10, small: true});
  }
  
  // 石堆：在村两头
  decos.push({t:'rockPile', x: VILLAGE_X_START - 60});
  decos.push({t:'rockPile', x: VILLAGE_X_END + 60});
  
  // 陶罐：选几户门口
  for(let i=1; i<houses.length; i+=4){
    const h = houses[i];
    decos.push({t:'pots', x: houseLeft(h) + 8, n: 3});
  }
  
  // 花：广场周围和部分门口
  decos.push({t:'flowers', x: VILLAGE_SQUARE_START - 15, n: 5});
  decos.push({t:'flowers', x: VILLAGE_SQUARE_END + 15, n: 5});
  
  // === 神树广场装饰：花坛、石凳、石碑，让开放空间不显空 ===
  const sqCenter = (VILLAGE_SQUARE_START + VILLAGE_SQUARE_END) / 2;
  // 石凳（6个）：广场左前、左中、左后 + 右前、右中、右后，对称分布
  // 注意：左右各 3 个，避开石灯和木杆灯笼位置
  const benchXL1 = VILLAGE_SQUARE_START + 160;  // 左前
  const benchXL2 = VILLAGE_SQUARE_START + 350;  // 左中
  const benchXL3 = VILLAGE_SQUARE_END   - 350;  // 右中
  const benchXR1 = VILLAGE_SQUARE_END   - 160;  // 右前
  const benchXM1 = sqCenter - 520;             // 左后近树
  const benchXM2 = sqCenter + 520;             // 右后近树
  decos.push({t:'stoneBench', x: benchXL1});
  decos.push({t:'stoneBench', x: benchXL2});
  decos.push({t:'stoneBench', x: benchXL3});
  decos.push({t:'stoneBench', x: benchXR1});
  decos.push({t:'stoneBench', x: benchXM1});
  decos.push({t:'stoneBench', x: benchXM2});
  
  // 花坛（4个）：广场四角，圆形石砌花坛，里面种鲜花
  const bedX1 = VILLAGE_SQUARE_START + 240;  // 左前
  const bedX2 = VILLAGE_SQUARE_END   - 240;  // 右前
  const bedX3 = VILLAGE_SQUARE_START + 520;  // 左后
  const bedX4 = VILLAGE_SQUARE_END   - 520;  // 右后
  decos.push({t:'flowerBed', x: bedX1});
  decos.push({t:'flowerBed', x: bedX2});
  decos.push({t:'flowerBed', x: bedX3});
  decos.push({t:'flowerBed', x: bedX4});
  
  // 石碑（2个）：广场左前、右前各一，刻有村规/祈福文字
  decos.push({t:'stele', x: VILLAGE_SQUARE_START + 100});
  decos.push({t:'stele', x: VILLAGE_SQUARE_END   - 100});
  
  for(let i=3; i<houses.length; i+=7){
    const h = houses[i];
    decos.push({t:'flowers', x: houseLeft(h) + 15, n: 4});
  }
  
  return decos;
}

const platforms = [];
(function initPlatforms(){
  for(const h of houses){
    if(!h.rooms || !h.rooms.length) continue;
    const totalW = h.rooms.reduce((a,r)=>a+(r.w||0),0);
    const hWall = h.hWall || h.h || 130;
    const roofH = h.roofH || ROOF_H;
    const flatW = h.flatW || 80;
    const roofOver = ROOF_OVER;
    platforms.push({
      cx: h.x,
      flatY: gy() - hWall - roofH,
      flatW: flatW,
      eaveY: gy() - hWall,
      totalW: totalW + roofOver*2
    });
  }
  for(const b of buildings){
    if(!b || !b.t) continue;
    if(b.t==='shrine'){
      const roofOver=50;
      const baseY = gy() - b.h - 18;
      platforms.push({cx:b.x, flatY:baseY-b.roofH, flatW:b.flatW, eaveY:baseY, totalW:b.w+roofOver*2});
    }
    if(b.t==='granary'){
      const roofOver=28;
      const baseY = gy() - b.h;
      platforms.push({cx:b.x, flatY:baseY-b.roofH, flatW:b.flatW, eaveY:baseY, totalW:b.w+roofOver*2});
    }
    if(b.t==='blacksmith'){
      const roofOver=ROOF_OVER;
      const postH = b.postH || 150;
      const baseY = gy() - postH;
      platforms.push({cx:b.x, flatY:baseY-b.roofH, flatW:b.flatW, eaveY:baseY, totalW:b.w+roofOver*2});
    }
    if(b.t==='mill'){
      const roofOver=50;
      const baseY = gy() - b.h;
      platforms.push({cx:b.x, flatY:baseY-b.roofH, flatW:b.flatW, eaveY:baseY, totalW:b.w+roofOver*2});
    }
    if(b.t==='tavern'){
      const roofOver=35;
      const baseY = gy() - b.h;
      platforms.push({cx:b.x, flatY:baseY-b.roofH, flatW:b.flatW, eaveY:baseY, totalW:b.w+roofOver*2});
    }
    if(b.t==='teaShed'){
      const roofOver=30;
      const baseY = gy() - b.h;
      platforms.push({cx:b.x, flatY:baseY-b.roofH, flatW:b.flatW, eaveY:baseY, totalW:b.w+roofOver*2});
    }
    if(b.t==='school'){
      const roofOver=45;
      const baseY = gy() - b.h;
      platforms.push({cx:b.x, flatY:baseY-b.roofH, flatW:b.flatW, eaveY:baseY, totalW:b.w+roofOver*2});
    }
    if(b.t==='clinic'){
      const roofOver=25;
      const baseY = gy() - b.h;
      platforms.push({cx:b.x, flatY:baseY-b.roofH, flatW:b.flatW, eaveY:baseY, totalW:b.w+roofOver*2});
    }
    if(b.t==='stage'){
      // 戏台石砌高台（可站上去）+ 屋顶碰撞
      const plH = b.platformH || 60;
      const stageTop = gy() - plH; // 台顶高度
      const roofOver = 30;
      const baseY = stageTop - 40; // 柱子顶
      platforms.push({cx:b.x, flatY:stageTop, flatW:b.w, eaveY:stageTop, totalW:b.w, isStageFloor:true});
      platforms.push({cx:b.x, flatY:baseY-b.roofH, flatW:b.flatW, eaveY:baseY, totalW:b.w+roofOver*2});
    }
    if(b.t==='carpenter'){
      const roofOver=25;
      const baseY = gy() - b.h;
      platforms.push({cx:b.x, flatY:baseY-b.roofH, flatW:b.flatW, eaveY:baseY, totalW:b.w+roofOver*2});
    }
    if(b.t==='tofuShop'){
      const roofOver=20;
      const baseY = gy() - b.h;
      platforms.push({cx:b.x, flatY:baseY-b.roofH, flatW:b.flatW, eaveY:baseY, totalW:b.w+roofOver*2});
    }
    // 注意：tudi土地庙和woodshed柴房太小，不加屋顶碰撞platform
  }
  // 篝火木柴矮平台（贴地面，玩家能站上去且触发着火）
  if(campfire){
    platforms.push({
      cx: campfire.x,
      flatY: gy() - campfire.h,
      flatW: campfire.w,
      eaveY: gy() - campfire.h,
      totalW: campfire.w,
      isCampfire: true
    });
  }
})();

function makeSpellIcon(){
  const c=document.createElement('canvas'); c.width=64; c.height=64;
  const x=c.getContext('2d');
  x.imageSmoothingEnabled=false;
  x.fillStyle='#0a1628'; x.fillRect(0,0,64,64);
  x.fillStyle='#0f2240'; x.fillRect(4,4,56,56);
  x.strokeStyle='#7df9ff'; x.lineWidth=2;
  x.beginPath(); x.arc(32,32,26,0,Math.PI*2); x.stroke();
  x.strokeStyle='rgba(125,249,255,0.4)'; x.lineWidth=1;
  x.beginPath(); x.arc(32,32,22,0,Math.PI*2); x.stroke();
  x.strokeStyle='#bff8ff'; x.lineWidth=3; x.lineCap='round';
  for(let i=0;i<3;i++){
    const a=i*Math.PI*2/3 - Math.PI/2;
    x.beginPath();
    x.arc(32,32,18,a,a+1.2);
    x.stroke();
  }
  x.fillStyle='#f0d0a8';
  x.fillRect(26,26,12,10);
  x.fillRect(24,30,4,8);
  x.fillRect(36,30,4,8);
  x.fillStyle='#d4a878';
  x.fillRect(26,34,12,2);
  x.fillStyle='#7df9ff';
  x.fillRect(14,20,3,3); x.fillRect(48,24,3,3);
  x.fillRect(18,44,3,3); x.fillRect(46,42,3,3);
  return c.toDataURL();
}
function makeJumpIcon(){

function tryJump(){

    player.vy=-380; player.onGround=false; player.jumpsLeft=1;
    spawnPuff(player.x+player.w/2, gy(), 8, '#d9d9d9');
  } else if(player.jumpsLeft>0){

    player.qi -= JUMP_QI_COST;
    player.vy=-340; player.jumpsLeft--;
    spawnPuff(player.x+player.w/2, player.y+player.h, 10, '#ffb366');

}
function tryDash(){
  if(player.dashCd>0 || player.dashTimer>0) return;
  if(!player.onGround && player.airDashUsed) return;
  if(player.qi < DASH_QI_COST) return;
  player.qi -= DASH_QI_COST;
  player.dashTimer=DASH_TIME; player.dashCd=DASH_CD_MAX;
  player.dashInvuln=DASH_TIME;
  if(!player.onGround) player.airDashUsed=true;
}
function tryAttack(){
  if(player.attackCd>0) return;
  if(player.dashTimer>0) return;
  player.attackCd=ATTACK_CD_MAX;
  player.atkFx=0.22;
  if(player.enchant>0 && player.enchantCharges>0){
    player.enchantCharges--;
    player.atkEnchanted=true;
    spawnSlash(true);
    if(player.enchantCharges<=0) player.enchant=0;
  } else {
    player.atkEnchanted=false;
    spawnSlash(false);
  }
}
function trySkill(){
  if(player.skillCd>0) return;
  if(player.dashTimer>0) return;
  if(player.mindDebt>0) return;
  if(player.spirit < SPELL_SPIRIT_COST) return;
  player.spirit -= SPELL_SPIRIT_COST;
  player.skillCd = SKILL_CD_MAX;

function tryUltimateCycle(){

  if(player.dashTimer>0) return;

    if(player.spirit<=0 || player.mind<=0) return;

let camX=0, camY=0;
function updateCamera(dt){
  const tx=player.x+player.w/2-W/2;
  const ty=player.y+player.h/2-H*0.62;
  camX+=(tx-camX)*Math.min(1,dt*7);
  camY+=(ty-camY)*Math.min(1,dt*5);
  camX=Math.max(0,Math.min(MAP_W-W,camX));
  camY=Math.max(-90,Math.min(0,camY));
}
let last=performance.now();
function loop(now){
  const dt=Math.min(0.033,(now-last)/1000); last=now;

}
function update(dt){
  player.animTime+=dt;
  let move=0;
  if(keys['ArrowLeft']||keys['KeyA']) move-=1;
  if(keys['ArrowRight']||keys['KeyD']) move+=1;
  let sprinting=false;
  if((keys['ControlLeft']||keys['ControlRight']) && move!==0 && player.stamina>0 && player.dashTimer<=0) sprinting=true;
  if(player.dashTimer>0){
    player.dashTimer-=dt;
    player.vx=player.facing*460;
    if(rng()<0.7) player.afterimages.push({x:player.x,y:player.y,life:0.22});
  } else {
    const target=move*(sprinting?SPRINT_SPEED:RUN_SPEED);
    player.vx+=(target-player.vx)*Math.min(1,dt*(sprinting?16:13));
    if(move!==0) player.facing=move;
  }
  if(player.dashInvuln>0) player.dashInvuln-=dt;
  if(player.dashCd>0) player.dashCd=Math.max(0,player.dashCd-dt);
  if(player.attackCd>0) player.attackCd=Math.max(0,player.attackCd-dt);
  if(sprinting){
    player.stamina=Math.max(0,player.stamina-SPRINT_DRAIN*dt);
    player.staminaDelay=0.2;
  }
  if(keys['KeyQ'] && !ultHoldFired){
    ultHoldTime+=dt;
    if(ultHoldTime>=ULT_HOLD){ ultHoldFired=true; tryUltimateBurst(); }
  }
  player.vy+=920*dt;
  if(player.vy>620) player.vy=620;
  player.x+=player.vx*dt;
  player.y+=player.vy*dt;
  if(player.y+player.h>=gy()){
    player.y=gy()-player.h; player.vy=0;
    player.onGround=true; player.jumpsLeft=1;
    player.airDashUsed=false;
  } else player.onGround=false;
  for(const pf of platforms){
    const left = pf.cx - pf.totalW/2;
    const right = pf.cx + pf.totalW/2;
    if(player.x+player.w > left && player.x < right){
      const px = player.x + player.w/2;
      let roofY;
      if(Math.abs(px - pf.cx) <= pf.flatW/2){
        roofY = pf.flatY;
      } else if(px < pf.cx){
        const t = (pf.cx - pf.flatW/2 - px) / ((pf.totalW - pf.flatW)/2);
        roofY = pf.flatY + t * (pf.eaveY - pf.flatY);
      } else {
        const t = (px - (pf.cx + pf.flatW/2)) / ((pf.totalW - pf.flatW)/2);
        roofY = pf.flatY + t * (pf.eaveY - pf.flatY);
      }
      if(player.vy>=0 && player.y+player.h >= roofY && player.y+player.h - player.vy*dt <= roofY+15){
        player.y = roofY - player.h; player.vy=0; player.onGround=true; player.jumpsLeft=1; player.airDashUsed=false;
      }
    }
  }
  player.x=Math.max(0,Math.min(MAP_W-player.w,player.x));
  player.staminaDelay-=dt;
  if(!sprinting && player.staminaDelay<=0 && player.stamina<player.maxStamina){
    const sRegen=(move===0)?STAMINA_REGEN_IDLE:STAMINA_REGEN_WALK;
    player.stamina=Math.min(player.maxStamina,player.stamina+sRegen*dt);
  }
  if(player.dashTimer<=0 && player.qi<player.maxQi){
    const qReg=(player.onGround && move===0)?QI_REGEN_IDLE:QI_REGEN_MOVE;
    player.qi=Math.min(player.maxQi,player.qi+qReg*dt);
  }
  if(player.onGround && move===0 && player.skillFx<=0 && player.ultState!=='running' && player.dashTimer<=0 && player.spirit<player.maxSpirit)
    player.spirit=Math.min(player.maxSpirit,player.spirit+SPIRIT_REGEN*dt);
  if(player.onGround && move===0 && player.ultState!=='running' && player.mindCorrode<=0 && player.mindDebt<=0 && player.dashTimer<=0 && player.mind<player.maxMind)
    player.mind=Math.min(player.maxMind,player.mind+MIND_REGEN*dt);
  if(player.ultState==='running'){
    player.spirit=Math.max(0,player.spirit-DOMAIN_SPIRIT_DRAIN*dt);
    player.mind=Math.max(0,player.mind-DOMAIN_MIND_DRAIN*dt);
    if(player.mind<=0){
      player.mind=0; player.ultState='idle'; player.mindDebt=MIND_DEBT_TIME;
    } else if(player.spirit<=0){
      player.spirit=0; player.ultState='idle';
      spawnDomainFizzle('#7df9ff');
    }
  }
  if(player.mindCorrode>0){
    player.mindCorrode=Math.max(0,player.mindCorrode-dt);
    if(player.mindDebt<=0){
      player.mind=Math.max(0,player.mind-CORRODE_MIND_DRAIN*dt);
      if(player.mind<=0){ player.mind=0; player.mindDebt=MIND_DEBT_TIME; }
    }
  }
  if(player.mindDebt>0){
    player.mindDebt=Math.max(0,player.mindDebt-dt);
    player.mind=0;
    if(player.mindDebt<=0){ player.mindDebt=0; player.mind=10; }
  }
  if(tornado){
    tornado.life-=dt;
    tornado.x+=tornado.vx*dt;
    tornado.travelled+=Math.abs(tornado.vx*dt);
    tornado.rot+=dt*10;
    for(let i=0;i<5;i++){
      const a=rng()*Math.PI*2, sr=20+rng()*50;
      const bx=tornado.x+Math.cos(a)*sr;
      const by=tornado.baseY-30-rng()*160;
      const dir=Math.cos(a)>=0?1:-1;
      const sp=80+rng()*160;
      particles.push({x:bx,y:by,vx:dir*sp+tornado.vx*0.2,vy:rng()*40-20,life:0.3+rng()*0.25,max:0.55,c:i%2===0?'#ffffff':'#bff8ff',s:8+rng()*10,g:0,isBlade:true});
    }
    if(tornado.life<=0 || tornado.travelled>700) tornado=null;
  }
  if(player.skillCd>0) player.skillCd=Math.max(0,player.skillCd-dt);
  if(player.enchant>0) player.enchant=Math.max(0,player.enchant-dt);
  if(player.ultBurstAnim>0) player.ultBurstAnim=Math.max(0,player.ultBurstAnim-dt);
  for(const a of player.afterimages) a.life-=dt;
  player.afterimages=player.afterimages.filter(a=>a.life>0);
  if(player.skillFx>0) player.skillFx-=dt;
  if(player.atkFx>0) player.atkFx-=dt;
  // 篝火系统（永不熄灭）
  if(campfire){
    // 烟雾粒子：每0.08秒生成一个灰色粒子，向上飘300px高，左右摇摆
    campfire.smokeTimer += dt;
    while(campfire.smokeTimer >= 0.08){
      campfire.smokeTimer -= 0.08;
      const sx = campfire.x + (rng()-0.5)*14;
      const sy = gy() - campfire.h - campfire.flameH;
      particles.push({
        x: sx, y: sy,
        vx: (rng()-0.5)*20,
        vy: -40 - rng()*30,
        life: 3.0 + rng()*1.0,
        max: 4.0,
        c: rng()<0.5 ? '#6a6a6a' : '#8a8a8a',
        s: 5 + rng()*4,
        g: -6,
        isSmoke: true,
        sway: rng()*Math.PI*2,
        swaySp: 1.5 + rng()*1.5
      });
    }
    // 火焰粒子闪烁
    if(rng() < 0.6){
      const fx = campfire.x + (rng()-0.5)*20;
      const fy = gy() - campfire.h - 6 - rng()*18;
      particles.push({
        x: fx, y: fy,
        vx: (rng()-0.5)*40,
        vy: -80 - rng()*80,
        life: 0.35 + rng()*0.5,
        max: 0.85,
        c: rng()<0.5 ? '#ffb84a' : '#ff6a2a',
        s: 4 + rng()*3,
        g: 100
      });
    }
    // 伤害检测：玩家中心距篝火中心<45px时触发着火
    const pCx = player.x + player.w/2;
    const pCy = player.y + player.h/2;
    const dx = pCx - campfire.x;
    const dy = pCy - (gy() - campfire.h/2);
    const dist = Math.sqrt(dx*dx + dy*dy);
    if(dist < 45){
      player.fireTimer = 3;
    }
  }
  // 玩家着火状态
  if(player.fireTimer === undefined) player.fireTimer = 0;
  if(player.fireTimer > 0){
    player.fireTimer -= dt;
    if(player.fireTimer < 0) player.fireTimer = 0;
    // 持续掉血，每秒8点，HP最低保持1
    player.hp = Math.max(1, player.hp - 8 * dt);
    // 玩家身上火焰粒子
    if(rng() < 0.7){
      const fx = player.x + rng()*player.w;
      const fy = player.y + rng()*player.h*0.7;
      particles.push({
        x: fx, y: fy,
        vx: (rng()-0.5)*20,
        vy: -50 - rng()*40,
        life: 0.25 + rng()*0.3,
        max: 0.55,
        c: rng()<0.6 ? '#ff8c1a' : (rng()<0.5 ? '#ffd700' : '#ff3a2a'),
        s: 3 + rng()*2,
        g: 60
      });
    }
  }
  for(const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=(p.g||200)*dt; p.life-=dt; if(p.isSmoke){ p.sway=(p.sway||0)+(p.swaySp||2)*dt; p.vx=Math.sin(p.sway)*18; } }
  for(let i=particles.length-1;i>=0;i--) if(particles[i].life<=0) particles.splice(i,1);
  for(const c of clouds){ c.x+=c.v*dt; if(c.x>MAP_W+150) c.x=-150; }
  if(!player.onGround) player.state=player.vy<0?'jump':'fall';
  else if(Math.abs(player.vx)>20) player.state='run';
  else player.state='idle';
  updateCamera(dt);
  updateSkillUI();
  if(charPanel.classList.contains('show')) updateCharStats();
}

function drawMountainLayer(par,color,sc){
  ctx.fillStyle=color;
  for(const m of mountains){
    const x=m.x-camX*par;
    if(x+m.w<-200||x>W+200) continue;
    ctx.beginPath();
    ctx.moveTo(x,gy()-camY);
    ctx.lineTo(x+m.w*0.5,gy()-m.h*sc-camY);

    ctx.closePath(); ctx.fill();
  }
}

function drawHouse(h){
  if(!h || !h.rooms || !h.rooms.length) return;
  const gyy=gy();
  const totalW = h.rooms.reduce((a,r)=>a+(r.w||0),0);
  if(!totalW) return;
  const hWall = h.hWall || h.h || 130;
  const roofH = h.roofH || ROOF_H;
  const flatW = h.flatW || 80;
  const roofOver = ROOF_OVER;
  const hx = h.x - totalW/2;

  // 墙顶高光
  const topColor = h.wallColor==='#8b7355' ? '#a08060' : (h.wallColor==='#9b8565' ? '#b89872' : '#8e785a');
  ctx.fillStyle=topColor;
  ctx.fillRect(hx+3, hy+3, totalW-6, 7);
  // 水平砖纹
  const lineColor = h.wallColor==='#8b7355' ? '#705940' : (h.wallColor==='#9b8565' ? '#7e6850' : '#645238');
  ctx.fillStyle=lineColor;
  for(let yy=hy+16; yy<gyy-7; yy+=24) ctx.fillRect(hx+3, yy, totalW-6, 2);
  // 垂直砖纹
  const vLineColor = h.wallColor==='#8b7355' ? '#6b5a4a' : (h.wallColor==='#9b8565' ? '#7a6850' : '#5b4a38');
  ctx.fillStyle=vLineColor;
  for(let xx=hx+14; xx<hx+totalW-14; xx+=38) ctx.fillRect(xx, hy+10, 2, hWall-22);
  // 各房间：隔墙、裂纹、破门、门、窗
  for(let i=0;i<roomCount;i++){
    const r = h.rooms[i];
    let rx = hx;
    for(let j=0;j<i;j++) rx += h.rooms[j].w;
    if(roomCount>1 && i>0){
      ctx.fillStyle=lineColor;

      ctx.fillStyle='#5a3a2a';
      ctx.fillRect(doorX+5, gyy-dh+5, dw-10, dh-10);
      ctx.fillStyle='#4a3a2a';
      ctx.fillRect(doorX+dw/2-1, gyy-dh+5, 2, dh-10);

      if(type==='cross'){

       } else if(type==='vert'){
         ctx.fillRect(wx+5, wy, 2, ws);

      ctx.fillRect(wx-3, wy-4, ws+6, 5);
      ctx.fillRect(wx-3, wy+ws-1, ws+6, 5);

  ctx.moveTo(hx - roofOver, hy);
  ctx.lineTo(h.x - flatHalf, roofTop);
  ctx.lineTo(h.x + flatHalf, roofTop);
  ctx.lineTo(hx + totalW + roofOver, hy);
  ctx.closePath(); ctx.fill();
  const darkRoof = h.roofColor==='#5a4a3a' ? '#4a3a2a' : '#5a4a3a';
  ctx.fillStyle=darkRoof;
  ctx.fillRect(hx - roofOver, hy-4, totalW + roofOver*2, 6);
  ctx.fillRect(h.x - flatHalf - 3, roofTop - 4, flatW + 6, 6);
  // 茅草层（屋顶表面的小矩形）
  const tuffColor = h.roofColor==='#5a4a3a' ? '#6b5a4a' : '#7a6850';
  ctx.fillStyle=tuffColor;
  const thatchCount = Math.floor((totalW + roofOver*2) / 22);
  for(let k=0;k<thatchCount;k++){
    const kx = hx - roofOver + k * (totalW + roofOver*2) / thatchCount;
    const th = 7 + (k%3)*2;
    const tw = 10 + (k%4)*3;

    ctx.fillStyle='#5a3a2a';

    ctx.fillRect(porchX+porchW-14, porchTop, 9, hWall - 16);
    ctx.fillStyle='#8b6508';

    const chimH = 17 + Math.floor(seed % 4); // 高出屋顶17-20px

    const chimX = hx + totalW * (h.chimneyX || 0.65) - chimW/2;

    // 屋顶结构：飞檐(roofOver, 水平) → 斜坡(slopeW, 上升) → 平顶(flatW, 水平) → 斜坡 → 飞檐

    ctx.fillRect(chimX-3, chimTopY-4, chimW+6, 5);
    ctx.fillStyle='#5a3a1e';

function drawVillageDeco(v){
  const gyy=gy();
  if(v.t==='well'){
    ctx.fillStyle='#7a7a7a';
    ctx.fillRect(v.x-26,gyy-20,52,20);
    ctx.fillStyle='#5a5a5a';
    ctx.fillRect(v.x-26,gyy-20,52,5);
    ctx.fillStyle='#2a2a2a';
    ctx.fillRect(v.x-20,gyy-17,40,10);
    ctx.fillStyle='#9d9d9d';
    ctx.fillRect(v.x-22,gyy-40,4,22);
    ctx.fillRect(v.x+18,gyy-40,4,22);
    ctx.fillRect(v.x-22,gyy-44,44,5);
    ctx.fillStyle='#6b4423';
    ctx.fillRect(v.x-3,gyy-40,6,0);
    ctx.fillStyle='#8a8a8a';
    for(let i=0;i<6;i++){
      const bx=v.x-24+i*9;
      ctx.fillRect(bx,gyy-8,2,8);
    }
  } else if(v.t==='hay'){
    const s=v.s||1;
    ctx.fillStyle='#b8860b';
    ctx.beginPath();
    ctx.moveTo(v.x-28*s,gyy);
    ctx.lineTo(v.x+28*s,gyy);
    ctx.lineTo(v.x+14*s,gyy-34*s);
    ctx.lineTo(v.x-14*s,gyy-34*s);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#d4a020';
    ctx.fillRect(v.x-20*s,gyy-28*s,40*s,3);
    ctx.fillRect(v.x-15*s,gyy-18*s,30*s,3);
    ctx.fillStyle='#8b6508';
    ctx.fillRect(v.x-26*s,gyy-3,52*s,3);
    ctx.fillStyle='#a07020';
    for(let k=0;k<5;k++){
      const kx=v.x-24*s+k*12*s;
      ctx.fillRect(kx,gyy-34*s-k%2,4,3);
    }
  } else if(v.t==='fence'){
    const n=v.count||8;
    const gap=14;
    const startX=v.x-(n-1)*gap/2;
    for(let i=0;i<n;i++){
      if(v.broken && i<v.broken) continue;
      const fx=startX+i*gap;
      ctx.fillStyle='#6b4423';
      ctx.fillRect(fx-1.5,gyy-28,3,28);
      ctx.fillStyle='#5a3a1e';
      ctx.fillRect(fx-3,gyy-25,6,3);
    }
    const fx0=startX-3, fx1=startX+(n-1)*gap+3;
    ctx.fillStyle='#6b4423';
    ctx.fillRect(fx0,gyy-22,fx1-fx0,3);
    ctx.fillRect(fx0,gyy-12,fx1-fx0,3);
  } else if(v.t==='rack'){
    ctx.fillStyle='#6b4423';
    ctx.fillRect(v.x-30,gyy-42,3,42);
    ctx.fillRect(v.x+27,gyy-42,3,42);
    ctx.fillRect(v.x-34,gyy-46,64,3);
    if(v.clothes){
      ctx.fillStyle='#8b7355';
      ctx.fillRect(v.x-22,gyy-44,14,20);
      ctx.fillStyle='#6b5a4a';
      ctx.fillRect(v.x-4,gyy-44,12,18);
      ctx.fillStyle='#a08060';
      ctx.fillRect(v.x+12,gyy-44,13,22);
    } else {
      ctx.fillStyle='#c9a66b';
      ctx.fillRect(v.x-20,gyy-44,10,14);
      ctx.fillStyle='#a08050';
      ctx.fillRect(v.x+6,gyy-44,14,12);
      ctx.fillStyle='#8b6508';
      ctx.fillRect(v.x-10,gyy-44,8,10);
    }
  } else if(v.t==='stump'){
    const s=v.small?0.6:1;
    ctx.fillStyle='#5a3a1e';
    ctx.fillRect(v.x-12*s,gyy-10*s,24*s,10*s);
    ctx.fillStyle='#7a5230';
    ctx.fillRect(v.x-12*s,gyy-10*s,24*s,3);
    ctx.fillStyle='#3a2a1a';
    ctx.beginPath(); ctx.arc(v.x,gyy-8*s,7*s,0,Math.PI*2); ctx.fill();
    if(!v.small){
      ctx.fillStyle='#4a3a2a';
      ctx.fillRect(v.x-9*s,gyy-10*s,3*s,3);
      ctx.fillRect(v.x+6*s,gyy-10*s,3*s,3);
    }
  } else if(v.t==='rockPile'){
    ctx.fillStyle='#7a7a7a';
    ctx.fillRect(v.x-20,gyy-9,14,9);
    ctx.fillRect(v.x-6,gyy-14,16,14);
    ctx.fillRect(v.x+12,gyy-7,10,7);
    ctx.fillStyle='#9d9d9d';
    ctx.fillRect(v.x-17,gyy-7,4,3);
    ctx.fillRect(v.x-2,gyy-11,5,3);
    ctx.fillRect(v.x+13,gyy-6,3,2);
  } else if(v.t==='pots'){
    const n=v.n||3;
    for(let i=0;i<n;i++){
      const px=v.x-18+i*18;
      ctx.fillStyle='#a0522d';
      ctx.fillRect(px,gyy-14,14,14);
      ctx.fillStyle='#8b4513';
      ctx.fillRect(px,gyy-14,14,3);
      ctx.fillStyle='#6b3410';
      ctx.fillRect(px+2,gyy-3,10,3);
      ctx.fillStyle='#c97b4a';
      ctx.fillRect(px+2,gyy-11,2,8);
    }
  } else if(v.t==='flowers'){
    const n=v.n||6;
    const cs=['#ff5d8f','#ffd23f','#5ec8ff','#c77dff','#ff8a5c','#90ee90'];
    for(let i=0;i<n;i++){
      const fx=v.x-28+i*11+(i*13%7);
      ctx.fillStyle='#3a7a2a';
      ctx.fillRect(fx,gyy-11,2,11);
      ctx.fillStyle=cs[i%cs.length];
      ctx.fillRect(fx-4,gyy-15,8,5);
      ctx.fillStyle='#ffd700';
      ctx.fillRect(fx-1,gyy-13,2,2);
    }
  } else if(v.t==='stoneBench'){
    // 石凳：灰石材质，长方形凳面 + 两条石腿
    const bw=44, bh=8, bl=18; // 凳面宽/高/腿高
    const bx = v.x - bw/2;
    const by = gyy - bh - bl;
    ctx.fillStyle='#8a8a8a';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle='#7a7a7a';
    ctx.fillRect(bx, by, bw, 2);
    ctx.fillStyle='#6a6a6a';
    ctx.fillRect(bx, by+bh-2, bw, 2);
    // 石腿
    ctx.fillStyle='#7a7a7a';
    ctx.fillRect(bx+3, by+bh, 5, bl);
    ctx.fillRect(bx+bw-8, by+bh, 5, bl);
    ctx.fillStyle='#5a5a5a';
    ctx.fillRect(bx+3, by+bh+bl-3, 5, 3);
    ctx.fillRect(bx+bw-8, by+bh+bl-3, 5, 3);
  } else if(v.t==='flowerBed'){
    // 圆形石砌花坛：灰色石围边 + 里面多种颜色小花
    const bedR = 22;
    const bx = v.x, by = gyy();
    // 石砌围边
    ctx.fillStyle='#8a7a68';
    ctx.beginPath();
    ctx.ellipse(bx, by-6, bedR, 8, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#6a5a48';
    ctx.beginPath();
    ctx.ellipse(bx, by-4, bedR-2, 6, 0, 0, Math.PI*2);
    ctx.fill();
    // 土壤
    ctx.fillStyle='#5a3a20';
    ctx.beginPath();
    ctx.ellipse(bx, by-6, bedR-4, 5, 0, 0, Math.PI*2);
    ctx.fill();
    // 花丛（多种颜色）
    const flowerColors=['#ff5d8f','#ffd23f','#ff8a5c','#c77dff','#ff6b9d','#ffea00','#ff4040'];
    const fxList=[-12,-6,0,6,12,-9,3,9,-3];
    for(let i=0;i<fxList.length;i++){
      const fx = bx + fxList[i];
      const fyOff = (i%3) * 2 - 2;
      // 花茎
      ctx.fillStyle='#2d6b1e';
      ctx.fillRect(fx, by-14+fyOff, 2, 8);
      // 花朵
      ctx.fillStyle = flowerColors[i%flowerColors.length];
      ctx.fillRect(fx-3, by-17+fyOff, 6, 4);
      // 花芯
      ctx.fillStyle='#ffd700';
      ctx.fillRect(fx-1, by-16+fyOff, 2, 2);
    }
  } else if(v.t==='stele'){
    // 石碑：灰色长方体碑身 + 碑座 + 顶部装饰
    const sw=24, sh=60; // 碑身宽高
    const sx = v.x - sw/2;
    const sy = gyy - sh;
    // 碑座
    ctx.fillStyle='#6a6a6a';
    ctx.fillRect(sx-6, gyy-10, sw+12, 10);
    ctx.fillStyle='#5a5a5a';
    ctx.fillRect(sx-6, gyy-10, sw+12, 3);
    // 碑身
    ctx.fillStyle='#8a8a8a';
    ctx.fillRect(sx, sy, sw, sh-10);
    ctx.fillStyle='#7a7a7a';
    ctx.fillRect(sx, sy, 3, sh-10);
    ctx.fillStyle='#6a6a6a';
    ctx.fillRect(sx+sw-3, sy, 3, sh-10);
    // 碑顶（屋檐形）
    ctx.fillStyle='#7a7a7a';
    ctx.fillRect(sx-3, sy-8, sw+6, 8);
    ctx.fillStyle='#6a6a6a';
    ctx.fillRect(sx-3, sy-3, sw+6, 3);
    // 刻字（竖排，金色小字，示意用）
    ctx.fillStyle='#c9a66b';
    ctx.fillRect(sx+sw/2-2, sy+8, 4, 2);
    ctx.fillRect(sx+sw/2-2, sy+14, 4, 2);
    ctx.fillRect(sx+sw/2-2, sy+20, 4, 2);
    ctx.fillRect(sx+sw/2-2, sy+26, 4, 2);
    ctx.fillStyle='#a08858';
    ctx.fillRect(sx+sw/2-1, sy+32, 2, 2);
  }
}
function drawPlayer(){
  const p=player;
  let bob=0;
  if(p.state==='idle') bob=Math.sin(p.animTime*3)*1.5;
  else if(p.state==='run') bob=Math.abs(Math.sin(p.animTime*14))*-3;
  ctx.globalAlpha=0.22; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(p.x+p.w/2,gy()+3,20,6,0,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;
  if(p.ultState==='running'){
    const cx=p.x+p.w/2, cy=p.y+p.h/2;
    const pulse=0.5+0.5*Math.sin(p.animTime*5);
    const r=64+pulse*8;
    const grad=ctx.createRadialGradient(cx,cy,r*0.2,cx,cy,r);
    grad.addColorStop(0,'rgba(125,249,255,0)');
    grad.addColorStop(0.65,'rgba(125,249,255,0.10)');
    grad.addColorStop(1,'rgba(125,249,255,0.28)');
    ctx.fillStyle=grad;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(125,249,255,'+(0.45+pulse*0.35)+')';
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,'+(0.12+pulse*0.15)+')';
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(cx,cy,r*0.82,0,Math.PI*2); ctx.stroke();
    const rot=p.animTime*2.2;
    ctx.strokeStyle='rgba(191,248,255,0.55)';
    ctx.lineWidth=2;
    for(let i=0;i<4;i++){
      const a0=rot+i*Math.PI/2;
      ctx.beginPath();
      ctx.arc(cx,cy,r*0.62,a0,a0+1.6);
      ctx.stroke();
    }
    ctx.strokeStyle='rgba(125,249,255,0.38)';
    ctx.lineWidth=1.5;
    for(let i=0;i<5;i++){
      const a0=-rot*1.6+i*Math.PI*2/5;
      ctx.beginPath();
      ctx.arc(cx,cy,r*0.85,a0,a0+1.0);
      ctx.stroke();
    }
    for(let i=0;i<10;i++){
      const ang=p.animTime*1.8+i*Math.PI*2/10;
      const rr=r*(0.35+0.45*((i*0.13+p.animTime*0.3)%1));
      const px=cx+Math.cos(ang)*rr;
      const py=cy+Math.sin(ang)*rr*0.9;
      ctx.fillStyle='rgba(191,248,255,0.6)';
      ctx.fillRect(Math.floor(px-1),Math.floor(py-1),2,2);
    }
  }
  if(p.ultBurstAnim>0){
    const t=1-p.ultBurstAnim/BURST_TIME;
  }
  if(p.skillFx>0){
    const t=1-p.skillFx/0.55;
    const r=18+t*90;
    ctx.strokeStyle='rgba(125,249,255,'+(1-t)+')';
    ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(p.x+p.w/2,p.y+p.h/2,r,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle='rgba(191,248,255,'+(1-t)*0.6+')';
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(p.x+p.w/2,p.y+p.h/2,r*0.7,0,Math.PI*2); ctx.stroke();
  }
  if(p.atkFx>0){
    ctx.strokeStyle=(p.atkEnchanted?'rgba(125,249,255,':'rgba(255,255,255,')+(p.atkFx/0.22)+')';
    ctx.lineWidth=4;
    ctx.beginPath();
    const a0=p.facing>0?-0.6:Math.PI+0.6;
    ctx.arc(p.x+p.w/2,p.y+p.h/2,36,a0,a0+p.facing*1.4, p.facing<0);
    ctx.stroke();
  }
  if(p.dashTimer>0){
    ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=3;
    for(let i=0;i<4;i++){
      const yy=p.y+10+i*12;
      ctx.beginPath();
      ctx.moveTo(p.x+p.w/2-p.facing*(18+i*8),yy);
      ctx.lineTo(p.x+p.w/2-p.facing*(40+i*10),yy);
      ctx.stroke();
    }
  }
  ctx.font='52px serif'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillStyle='#fff';
  const drawChar=()=>{
    if(p.facing<0){
      ctx.save();
      ctx.translate(p.x+p.w,0);
      ctx.scale(-1,1);
      ctx.fillText('\u{1F920}',p.w/2,p.y+p.h-6+bob);
      ctx.restore();
    } else {
      ctx.fillText('\u{1F920}',p.x+p.w/2,p.y+p.h-6+bob);
    }
  };
  if(p.dashInvuln>0){
    ctx.globalAlpha=0.55+0.45*Math.abs(Math.sin(p.animTime*40));
    drawChar();
    ctx.globalAlpha=1;
  } else {
    drawChar();
  }
  if(p.enchant>0){
    const fast=p.enchant<=1;
    const blink=0.3+0.5*Math.abs(Math.sin(p.animTime*(fast?22:3.5)));
    const ex=p.x+p.w/2+p.facing*16, ey=p.y+p.h*0.58+bob;
    for(let i=0;i<3;i++){
      const ang=p.animTime*2.2+i*(Math.PI*2/3);
      const ox=Math.cos(ang)*7, oy=Math.sin(ang)*5;
      ctx.globalAlpha=blink*0.45;
      ctx.fillStyle='#bff8ff';
      ctx.fillRect(Math.floor(ex+ox-2),Math.floor(ey+oy-2),4,4);
      ctx.globalAlpha=blink;
      ctx.fillStyle='#7df9ff';
      ctx.fillRect(Math.floor(ex+ox-1),Math.floor(ey+oy-1),2,2);
    }
    ctx.globalAlpha=1;
  }
  // 玩家着火：橙红色闪烁覆盖
  if(p.fireTimer > 0){
    const burnRatio = Math.min(1, p.fireTimer / 3);
    const flick = 0.4 + 0.4*Math.sin(p.animTime*20);
    const alpha = (0.35 + flick*0.35) * Math.min(1, burnRatio + 0.3);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#ff4a1a';
    ctx.fillRect(p.x, p.y + bob, p.w, p.h);
    ctx.globalAlpha = alpha * 0.6;
    ctx.fillStyle = '#ffd700';
    ctx.fillRect(p.x+4, p.y + 8 + bob, p.w-8, p.h-14);
    ctx.globalAlpha = 1;
  }
}
function drawTornado(tn){
  const t=tn.travelled>500 ? Math.max(0,(700-tn.travelled)/200) : Math.min(1,tn.travelled/80);
  const lifeT=1-tn.life/tn.maxLife;
  const alpha=t;
  const tornadoH=220;
  const bottomR=10;
  const topR=60;
  const baseY=tn.baseY;
  const rot=tn.rot;
  const grd=ctx.createLinearGradient(tn.x,baseY,tn.x,baseY-tornadoH);
  grd.addColorStop(0,'rgba(125,249,255,0)');
  grd.addColorStop(0.5,'rgba(125,249,255,0.08)');
  grd.addColorStop(1,'rgba(125,249,255,0.15)');
  ctx.fillStyle=grd;
  ctx.beginPath();
  ctx.moveTo(tn.x-bottomR,baseY);
  ctx.lineTo(tn.x-topR,baseY-tornadoH);
  ctx.lineTo(tn.x+topR,baseY-tornadoH);
  ctx.lineTo(tn.x+bottomR,baseY);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='rgba(125,249,255,'+(0.6*alpha)+')';
  ctx.lineWidth=4;
  for(let i=0;i<7;i++){
    ctx.beginPath();
    for(let s=0;s<=32;s++){
      const h=s/32*tornadoH;
      const rr=bottomR+(h/tornadoH)*topR;
      const yy=baseY-h;
      const ang=rot*0.8+i*Math.PI*2/7+h*0.05;
      const xx=tn.x+Math.cos(ang)*rr;
      if(s===0) ctx.moveTo(xx,yy);
      else ctx.lineTo(xx,yy);
    }
    ctx.stroke();
  }
  ctx.strokeStyle='rgba(191,248,255,'+(0.5*alpha)+')';
  ctx.lineWidth=2.5;
  for(let i=0;i<6;i++){
    ctx.beginPath();
    for(let s=0;s<=28;s++){
      const h=s/28*tornadoH;
      const rr=(bottomR+(h/tornadoH)*topR)*0.78;
      const yy=baseY-h;
      const ang=-rot*1.1+i*Math.PI*2/6+h*0.06;
      const xx=tn.x+Math.cos(ang)*rr;
      if(s===0) ctx.moveTo(xx,yy);
      else ctx.lineTo(xx,yy);
    }
    ctx.stroke();
  }
  ctx.strokeStyle='rgba(255,255,255,'+(0.38*alpha)+')';
  ctx.lineWidth=2;
  for(let i=0;i<4;i++){
    ctx.beginPath();
    for(let s=0;s<=24;s++){
      const h=s/24*tornadoH;
      const rr=(bottomR+(h/tornadoH)*topR)*0.5;
      const yy=baseY-h;
      const ang=rot*1.5+i*Math.PI*2/4+h*0.07;
      const xx=tn.x+Math.cos(ang)*rr;
      if(s===0) ctx.moveTo(xx,yy);
      else ctx.lineTo(xx,yy);
    }
    ctx.stroke();
  }
  ctx.strokeStyle='rgba(125,249,255,'+(0.5*alpha)+')';
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(tn.x,baseY+2,15,3.5,0,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,'+(0.3*alpha)+')';
  ctx.lineWidth=1;
  ctx.beginPath(); ctx.ellipse(tn.x,baseY+2,10,2.5,0,0,Math.PI*2); ctx.stroke();
  for(let i=0;i<5;i++){
    const topH=tornadoH-10+i*6;
    const rr=topR+i*8;
    const ang=rot*0.5+i*1.2+lifeT*3;
    const px=tn.x+Math.cos(ang)*rr;
    const py=baseY-topH+Math.sin(ang*0.7)*6;
    ctx.fillStyle='rgba(191,248,255,'+(0.25*alpha)+')';
    ctx.beginPath(); ctx.arc(px,py,6+i,0,Math.PI*2); ctx.fill();
  }
}
function drawResourceBar(x,y,w,h,bg,fg,ratio,cur,max){
  ratio=Math.max(0,Math.min(1,ratio));
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(x-1,y-1,w+2,h+2);
  ctx.fillStyle=bg; ctx.fillRect(x,y,w,h);
  ctx.fillStyle=fg; ctx.fillRect(x,y,w*ratio,h);
  const lbl=Math.round(cur)+' / '+Math.round(max);
  ctx.font='bold 11px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#000';
  ctx.fillText(lbl,x+w/2+1,y+h/2); ctx.fillText(lbl,x+w/2-1,y+h/2);
  ctx.fillText(lbl,x+w/2,y+h/2+1); ctx.fillText(lbl,x+w/2,y+h/2-1);
  ctx.fillStyle='#fff';
  ctx.fillText(lbl,x+w/2,y+h/2);
}
function drawUI(){
  const mmS=Math.min(150,W*0.28), mmX=12, mmY=12;
  const mmRange=1400;
  const mmCenterX=Math.max(mmRange/2, Math.min(MAP_W-mmRange/2, player.x));
  const mmLeft=mmCenterX-mmRange/2;
  ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(mmX-2,mmY-2,mmS+4,mmS+4);
  ctx.fillStyle='rgba(16,34,18,0.88)'; ctx.fillRect(mmX,mmY,mmS,mmS);
  ctx.strokeStyle='#d4af37'; ctx.lineWidth=2; ctx.strokeRect(mmX,mmY,mmS,mmS);
  ctx.save();
  ctx.beginPath();
  ctx.rect(mmX,mmY,mmS,mmS);
  ctx.clip();
  const groundY=mmY+mmS*0.72;
  ctx.fillStyle='#5a9e3f'; ctx.fillRect(mmX,groundY,mmS,mmS*0.28);
  function wx2mm(wx){ return mmX+(wx-mmLeft)/mmRange*mmS; }
  // 神树广场（浅色地块）
  const sqCenter = (VILLAGE_SQUARE_START+VILLAGE_SQUARE_END)/2;
  if(sqCenter > mmLeft-mmRange*0.1 && sqCenter < mmLeft+mmRange*1.1){
    const slx = Math.max(VILLAGE_SQUARE_START, mmLeft);
    const srx = Math.min(VILLAGE_SQUARE_END, mmLeft+mmRange);
    if(srx > slx){
      ctx.fillStyle='#c4a878';
      ctx.fillRect(wx2mm(slx), groundY-2, (srx-slx)/mmRange*mmS, 3);
    }
  }
  if(VILLAGE_X_START<mmLeft+mmRange && VILLAGE_X_END>mmLeft){
    ctx.fillStyle='#c9a66b';
    const lx=Math.max(VILLAGE_X_START,mmLeft), rx=Math.min(VILLAGE_X_END,mmLeft+mmRange);
    ctx.fillRect(wx2mm(lx),groundY-1,(rx-lx)/mmRange*mmS,2);
  }
  for(const h of houses){
    const totalW = h.rooms.reduce((a,r)=>a+r.w,0);
    if(h.x+totalW/2<mmLeft-30||h.x-totalW/2>mmLeft+mmRange+30) continue;
    ctx.fillStyle='#6b4423';
    const mx=wx2mm(h.x-totalW/2);
    const mw=Math.max(2,totalW/mmRange*mmS);
    ctx.fillRect(mx,groundY-6,mw,6);
  }
  for(const b of buildings){
    if(b.x<mmLeft-20||b.x>mmLeft+mmRange+20) continue;
    if(b.t==='shrine'){
      ctx.fillStyle='#c94141';
      const mx=wx2mm(b.x-b.w/2);
      const mw=Math.max(3,b.w/mmRange*mmS);
      ctx.fillRect(mx,groundY-4,mw,4);
    } else if(b.t==='granary'){
      ctx.fillStyle='#c9a66b';
      const mx=wx2mm(b.x-b.w/2);
      const mw=Math.max(2,b.w/mmRange*mmS);
      ctx.fillRect(mx,groundY-3,mw,3);
    } else if(b.t==='blacksmith'){
      ctx.fillStyle='#7a5230';
      const mx=wx2mm(b.x-b.w/2);
      const mw=Math.max(2,b.w/mmRange*mmS);
      ctx.fillRect(mx,groundY-2,mw,2);
    } else if(b.t==='pigpen'){
      ctx.fillStyle='#f4a0a0';
      const mx=wx2mm(b.x);
      ctx.fillRect(mx-1,groundY-3,2,2);
    } else if(b.t==='woodshed'){
      ctx.fillStyle='#8b5a2b';
      const mx=wx2mm(b.x);
      ctx.fillRect(mx-1,groundY-3,2,2);
    } else if(b.t==='threshing'){
      ctx.fillStyle='#e8c54a';
      const mx=wx2mm(b.x-b.w/2);
      const mw=Math.max(3,b.w/mmRange*mmS);
      ctx.fillRect(mx,groundY-2,mw,2);
    } else if(b.t==='lantern'){
      ctx.fillStyle='#ffcc55';
      const mx=wx2mm(b.x);
      ctx.fillRect(mx-1,groundY-4,2,3);
    } else if(b.t==='altar'){
      ctx.fillStyle='#b0b0b0';
      const mx=wx2mm(b.x);
      ctx.fillRect(mx-2,groundY-3,4,2);
    } else if(b.t==='tudi'){
      ctx.fillStyle='#c94141';
      const mx=wx2mm(b.x);
      ctx.fillRect(mx-1,groundY-4,2,4);
    } else if(b.t==='mill'){
      ctx.fillStyle='#c9a66b';
      const mx=wx2mm(b.x);
      ctx.fillRect(mx-2,groundY-4,4,4);
    } else if(b.t==='tavern'){
      ctx.fillStyle='#8b6548';
      const mx=wx2mm(b.x-b.w/2);
      const mw=Math.max(2,b.w/mmRange*mmS);
      ctx.fillRect(mx,groundY-3,mw,3);
  } else if(b.t==='teaShed'){
    ctx.fillStyle='#7a5a3a';
    const mx=wx2mm(b.x);
    ctx.fillRect(mx-2,groundY-3,4,2);
  } else if(b.t==='school'){
    ctx.fillStyle='#c9b896';
    const mx=wx2mm(b.x-b.w/2);
    const mw=Math.max(4,b.w/mmRange*mmS);
    ctx.fillRect(mx,groundY-5,mw,5);
  } else if(b.t==='clinic'){
    ctx.fillStyle='#e8e0d0';
    const mx=wx2mm(b.x-b.w/2);
    const mw=Math.max(3,b.w/mmRange*mmS);
    ctx.fillRect(mx,groundY-4,mw,4);
    // 红十字标记
    const cmx=wx2mm(b.x);
    ctx.fillStyle='#c82828';
    ctx.fillRect(cmx-1,groundY-6,2,4);
    ctx.fillRect(cmx-2,groundY-5,4,2);
  } else if(b.t==='stage'){
    ctx.fillStyle='#a02020';
    const mx=wx2mm(b.x-b.w/2);
    const mw=Math.max(3,b.w/mmRange*mmS);
    ctx.fillRect(mx,groundY-4,mw,4);
  } else if(b.t==='carpenter'){
    ctx.fillStyle='#8b5a2b';
    const mx=wx2mm(b.x-b.w/2);
    const mw=Math.max(2,b.w/mmRange*mmS);
    ctx.fillRect(mx,groundY-3,mw,3);
  } else if(b.t==='tofuShop'){
    ctx.fillStyle='#ece8d8';
    const mx=wx2mm(b.x-b.w/2);
    const mw=Math.max(2,b.w/mmRange*mmS);
    ctx.fillRect(mx,groundY-3,mw,3);
  } else if(b.t==='poleLantern'){
    ctx.fillStyle='#d42020';
    const mx=wx2mm(b.x);
    ctx.fillRect(mx-1,groundY-6,2,4);
  } else if(b.t==='market'){
      ctx.fillStyle='#d4a020';
      const mx=wx2mm(b.x-b.w/2);
      const mw=Math.max(4,b.w/mmRange*mmS);
      ctx.fillRect(mx,groundY-5,mw,5);
    }
  }
  // 篝火（小色点）
  if(campfire){
    const cfx=wx2mm(campfire.x);
    if(cfx > -5 && cfx < mmS+5){
      ctx.fillStyle = campfire.lit ? '#ff6a2a' : '#5a5a5a';
      ctx.fillRect(cfx-1, groundY-3, 2, 2);
    }
  }
  // 神树（大绿点，超级大）
  const txr=wx2mm((VILLAGE_SQUARE_START+VILLAGE_SQUARE_END)/2);
  if(txr>-8 && txr<mmS+8){
    ctx.fillStyle='#1e5a1e'; ctx.fillRect(txr-2,groundY-12,4,12);
    ctx.fillStyle='#2d722d'; ctx.fillRect(txr-4,groundY-16,8,5);
    ctx.fillStyle='#5fbf5f'; ctx.fillRect(txr-3,groundY-19,6,4);
    ctx.fillStyle='#a0e8a0'; ctx.fillRect(txr-2,groundY-22,4,3);
  }
  ctx.fillStyle='#ffd700';
  const pxr=wx2mm(player.x);
  ctx.beginPath();
  ctx.moveTo(pxr,groundY-10);
  ctx.lineTo(pxr-4,groundY+2);
  ctx.lineTo(pxr+4,groundY+2);
  ctx.closePath(); ctx.fill();
  const vx=wx2mm(camX), vw=Math.max(3,W/mmRange*mmS);
  ctx.strokeStyle='rgba(255,255,255,0.75)'; ctx.lineWidth=1;
  ctx.strokeRect(vx,mmY,vw,mmS);
  ctx.restore();
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.fillRect(mmX-2,mmY+mmS+2,mmS+4,18);
  ctx.fillStyle='#ffe9a8'; ctx.font='10px monospace'; ctx.textAlign='center';
  const regionName=player.x>VILLAGE_X_START?'翠风平原·落风村':'翠风平原';
  ctx.fillText(regionName,mmX+mmS/2,mmY+mmS+14);
  const as=64;
  const bw=Math.min(230,W*0.38), bh=14, sh=9, gap=4;
  const totalW=as+10+bw;
  const ax=(W-totalW)/2;
  const ay=H-as-42;
  avatarBounds={x:ax,y:ay,w:as,h:as};
  ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(ax-2,ay-2,as+4,as+4);
  ctx.fillStyle='#15151f'; ctx.fillRect(ax,ay,as,as);
  ctx.strokeStyle='#d4af37'; ctx.lineWidth=2; ctx.strokeRect(ax,ay,as,as);
  ctx.font='40px serif'; ctx.textAlign='center';
  ctx.fillText('\u{1F920}',ax+as/2,ay+as-12);
  const bx=ax+as+10, by=ay+28;
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(bx-1,by-1,bw+2,bh+2);
  ctx.fillStyle='#3a0d0d'; ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle='#4ade80'; ctx.fillRect(bx,by,bw*(player.hp/player.maxHp),bh);
  ctx.strokeStyle='rgba(255,255,255,0.45)'; ctx.lineWidth=1; ctx.strokeRect(bx,by,bw,bh);
  const hpLbl=Math.round(player.hp)+' / '+Math.round(player.maxHp);
  ctx.font='bold 12px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#000';
  ctx.fillText(hpLbl,bx+bw/2+1,by+bh/2); ctx.fillText(hpLbl,bx+bw/2-1,by+bh/2);
  ctx.fillText(hpLbl,bx+bw/2,by+bh/2+1); ctx.fillText(hpLbl,bx+bw/2,by+bh/2-1);
  ctx.fillStyle='#fff';
  ctx.fillText(hpLbl,bx+bw/2,by+bh/2);
  ctx.fillStyle='#fff'; ctx.font='bold 16px monospace';
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillText(charInfo.name,bx,by-5);
  const sy=by+bh+gap;
  drawResourceBar(bx,sy,bw,sh,'#3a3300','#fbbf24',player.stamina/player.maxStamina,player.stamina,player.maxStamina);
  const qy=sy+sh+gap;
  drawResourceBar(bx,qy,bw,sh,'#3a1d00','#ff8c1a',player.qi/player.maxQi,player.qi,player.maxQi);
  const spy=qy+sh+gap;
  drawResourceBar(bx,spy,bw,sh,'#0d2a3d','#3ba7ff',player.spirit/player.maxSpirit,player.spirit,player.maxSpirit);
  const my=spy+sh+gap;
  drawResourceBar(bx,my,bw,sh,'#2d1240','#b86bff',player.mind/player.maxMind,player.mind,player.maxMind);
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.fillRect(12,H-30,140,20);
  ctx.fillStyle='#cfeeff'; ctx.font='10px monospace'; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillText('坐标 '+Math.floor(player.x)+' / '+MAP_W,18,H-16);
}
player.y=gy()-player.h;
requestAnimationFrame(loop);
</script>
